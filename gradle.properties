# ---------------------------------------------------------------------------
# DivTrack — propiedades de build
# ---------------------------------------------------------------------------

# --- JVM / Gradle ---
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g

# --- Android ---
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP descarga por su cuenta la plataforma y las build-tools exactas que necesita (las
# licencias se aceptan en CI). Evita que el build dependa de que el runner ya tenga
# instalada la versión concreta de build-tools que le toca a este AGP.
android.builder.sdkDownload=true

# AGP 9 usa por defecto las features nuevas que este proyecto aprovecha:
#   android.builtInKotlin=true   -> AGP compila Kotlin sin el plugin kotlin-android
#   android.newDsl=true          -> DSL público nuevo (kotlinOptions{} ya no existe)
#   android.sdk.defaultTargetSdkToCompileSdkIfUnset=true
#
# VÁLVULA DE ESCAPE (documentada en README.md y docs/DECISIONS.md): si alguna herramienta
# del ecosistema (KSP/Hilt/Compose) chocara con el Kotlin integrado, se desactiva el modo
# nuevo sin bajar de AGP 9 con estas dos líneas y el build sigue funcionando:
#   android.builtInKotlin=false
#   android.newDsl=false
