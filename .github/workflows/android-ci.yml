name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_API: "37.0"
  ANDROID_BUILD_TOOLS: "37.0.0"
  GRADLE_VERSION: "9.6.0"

jobs:
  build:
    name: Build · Test · R8
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK y licencias
        run: |
          SDK="/usr/local/lib/android/sdk"
          echo "SDK: $SDK"
          if [ -d "$SDK/cmdline-tools" ]; then
            SDKMANAGER=$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | tail -n 1)
            if [ -n "$SDKMANAGER" ]; then
              yes | "$SDKMANAGER" --licenses || true
              "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools" || true
            fi
          fi

      - name: Gradle y caché
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      - name: Verificar el wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Compilar debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Tests unitarios JVM
        run: ./gradlew testDebugUnitTest :domain:test :core:common:test --stacktrace

      - name: Release con R8
        run: ./gradlew :app:assembleRelease -PcomposeMetrics=true --stacktrace

      - name: DivTrack Lite release con R8
        run: ./gradlew -p lite :app:assembleRelease --stacktrace

      - name: DivTrack Lite debug (respaldo si no hay firma release)
        run: ./gradlew -p lite :app:assembleDebug --stacktrace

      - name: Lint
        continue-on-error: true
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Publicar artefactos
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: divtrack-artifacts
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/**/*.apk
            lite/app/build/outputs/apk/**/*.apk
            app/build/reports/lint-results-*.html
            **/build/reports/tests/**
            **/build/compose-metrics/**
            core/database/schemas/**

  release:
    name: Auto Release
    needs: build
    # Solo cuando todo compiló y pasó: cada push a main (o disparo manual) publica
    # un release rolling "latest" con el APK. Las PRs nunca publican.
    if: >-
      needs.build.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout (GitHub CLI necesita el repositorio local)
        uses: actions/checkout@v5

      - name: Descargar artefactos del build
        uses: actions/download-artifact@v5
        with:
          name: divtrack-artifacts
          path: artifacts

      - name: Firmar el APK release (o preparar el instalable de fallback)
        id: apk
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="/usr/local/lib/android/sdk/build-tools/${ANDROID_BUILD_TOOLS}"

          RELEASE_UNSIGNED=$(find artifacts/app/build/outputs/apk -name 'app-release-unsigned.apk' | head -n1)
          DEBUG_APK=$(find artifacts/app/build/outputs/apk -name 'app-debug.apk' | head -n1)
          LITE_RELEASE_UNSIGNED=$(find artifacts/lite/app/build/outputs/apk/release -name '*-release-unsigned.apk' | head -n1)
          LITE_DEBUG_APK=$(find artifacts/lite/app/build/outputs/apk/debug -name '*.apk' | head -n1)

          if [ -z "${RELEASE_UNSIGNED}" ] || [ ! -f "${RELEASE_UNSIGNED}" ]; then
            echo "::error::No se encontró el APK release sin firmar."
            exit 1
          fi

          if [ -n "${KEYSTORE_B64:-}" ] &&
             [ -n "${KEY_ALIAS:-}" ] &&
             [ -n "${KEYSTORE_PASS:-}" ] &&
             [ -n "${KEY_PASS:-}" ]; then
            echo "${KEYSTORE_B64}" | base64 -d > divtrack.jks
            "${BUILD_TOOLS}/zipalign" -f -p 4 "${RELEASE_UNSIGNED}" app-aligned.apk
            "${BUILD_TOOLS}/apksigner" sign \
              --ks divtrack.jks \
              --ks-key-alias "${KEY_ALIAS}" \
              --ks-pass "pass:${KEYSTORE_PASS}" \
              --key-pass "pass:${KEY_PASS}" \
              --out DivTrack-release.apk app-aligned.apk
            SELECTED_APK=DivTrack-release.apk
            EXPECTED_APPLICATION_ID=com.liebeblack.divtrack
            echo "apk=DivTrack-release.apk" >> "$GITHUB_OUTPUT"
            echo "channel=release" >> "$GITHUB_OUTPUT"
          else
            if [ -n "${KEYSTORE_B64:-}${KEY_ALIAS:-}${KEYSTORE_PASS:-}${KEY_PASS:-}" ]; then
              echo "::error::La firma release está configurada parcialmente; se requieren los cuatro secretos."
              exit 1
            fi
            if [ -z "${DEBUG_APK}" ] || [ ! -f "${DEBUG_APK}" ]; then
              echo "::error::No se encontró el APK debug firmado de respaldo."
              exit 1
            fi
            cp "${DEBUG_APK}" DivTrack-debug.apk
            SELECTED_APK=DivTrack-debug.apk
            EXPECTED_APPLICATION_ID=com.liebeblack.divtrack.debug
            echo "apk=DivTrack-debug.apk" >> "$GITHUB_OUTPUT"
            echo "channel=debug (sin secretos de firma)" >> "$GITHUB_OUTPUT"
          fi

          "${BUILD_TOOLS}/apksigner" verify "${SELECTED_APK}"
          BADGING=$("${BUILD_TOOLS}/aapt2" dump badging "${SELECTED_APK}")
          if ! printf '%s\n' "${BADGING}" | grep -Fq "package: name='${EXPECTED_APPLICATION_ID}' "; then
            echo "::error::El APK tiene un applicationId inesperado."
            exit 1
          fi

          if [ -n "${KEYSTORE_B64:-}" ] &&
             [ -n "${KEY_ALIAS:-}" ] &&
             [ -n "${KEYSTORE_PASS:-}" ] &&
             [ -n "${KEY_PASS:-}" ]; then
            if [ -z "${LITE_RELEASE_UNSIGNED}" ] || [ ! -f "${LITE_RELEASE_UNSIGNED}" ]; then
              echo "::error::No se encontró el APK release de DivTrack Lite."
              exit 1
            fi
            "${BUILD_TOOLS}/zipalign" -f -p 4 "${LITE_RELEASE_UNSIGNED}" apklite-aligned.apk
            "${BUILD_TOOLS}/apksigner" sign \
              --ks divtrack.jks \
              --ks-key-alias "${KEY_ALIAS}" \
              --ks-pass "pass:${KEYSTORE_PASS}" \
              --key-pass "pass:${KEY_PASS}" \
              --out apklite.apk apklite-aligned.apk
            rm -f apklite-aligned.apk
            LITE_CHANNEL="release"
          else
            if [ -z "${LITE_DEBUG_APK}" ] || [ ! -f "${LITE_DEBUG_APK}" ]; then
              echo "::error::No se encontró APK debug firmado para DivTrack Lite."
              exit 1
            fi
            cp "${LITE_DEBUG_APK}" apklite.apk
            LITE_CHANNEL="debug (firma de desarrollo)"
          fi

          "${BUILD_TOOLS}/apksigner" verify apklite.apk
          LITE_BADGING=$("${BUILD_TOOLS}/aapt2" dump badging apklite.apk)
          if ! printf '%s\n' "${LITE_BADGING}" | grep -Fq "package: name='com.liebeblack.divtrack.lite' "; then
            echo "::error::El APK Lite tiene un applicationId inesperado."
            exit 1
          fi
          rm -f divtrack.jks app-aligned.apk apklite-aligned.apk
          echo "lite_channel=${LITE_CHANNEL}" >> "$GITHUB_OUTPUT"

      - name: Leer versión del APK
        id: version
        run: |
          set -euo pipefail
          BUILD_TOOLS="/usr/local/lib/android/sdk/build-tools/${ANDROID_BUILD_TOOLS}"
          BADGING=$("${BUILD_TOOLS}/aapt2" dump badging "${{ steps.apk.outputs.apk }}" | grep -m1 "versionName")
          VERSION=$(echo "${BADGING}" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Crear o actualizar el release rolling
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.apk.outputs.apk }}
          CHANNEL: ${{ steps.apk.outputs.channel }}
          LITE_CHANNEL: ${{ steps.apk.outputs.lite_channel }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)

          # Release rolling: la etiqueta "latest" se mueve en cada push. Borrar el release
          # con --cleanup-tag deja el repo con UNA sola publicación siempre vigente.
          gh release delete latest --yes --cleanup-tag || true

          gh release create latest \
            --title "DivTrack ${VERSION} (latest)" \
            --notes "$(cat <<EOF
          ## DivTrack ${VERSION}

          Compilado automáticamente desde [\`${SHORT_SHA}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}).

          - **Canal:** ${CHANNEL}
          - **Canal Lite:** ${LITE_CHANNEL}
          - **Fecha:** ${STAMP}
          - **Instalación:** descarga el APK y ábrelo (activa "orígenes desconocidos" si lo pide).
          - **Lite:** descarga \`apklite.apk\` para la versión ultraligera, limitada a la tasa BCV.

          > El release se reemplaza en cada push a \`main\` una vez que compila y pasan los tests.
          EOF
          )" \
            "${APK_PATH}" \
          "apklite.apk#DivTrack Lite (${LITE_CHANNEL})"
