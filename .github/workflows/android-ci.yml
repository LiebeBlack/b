name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_API: "37.0"
  ANDROID_BUILD_TOOLS: "37.0.0"
  GRADLE_VERSION: "9.6.0"

jobs:
  build:
    name: Build · Test · R8
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK y licencias
        run: |
          SDK="/usr/local/lib/android/sdk"
          echo "SDK: $SDK"
          if [ -d "$SDK/cmdline-tools" ]; then
            SDKMANAGER=$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | tail -n 1)
            if [ -n "$SDKMANAGER" ]; then
              yes | "$SDKMANAGER" --licenses || true
              "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools" || true
            fi
          fi

      - name: Gradle y caché
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      - name: Verificar el wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Compilar debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Tests unitarios JVM
        run: ./gradlew testDebugUnitTest :domain:test :core:common:test --stacktrace

      - name: Release con R8
        run: ./gradlew :app:assembleRelease -PcomposeMetrics=true --stacktrace

      - name: Lint
        continue-on-error: true
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Publicar artefactos
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: divtrack-artifacts
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/reports/lint-results-*.html
            **/build/reports/tests/**
            **/build/compose-metrics/**
            core/database/schemas/**
