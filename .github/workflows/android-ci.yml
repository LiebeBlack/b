name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_API: "37.0"
  ANDROID_BUILD_TOOLS: "37.0.0"
  GRADLE_VERSION: "9.6.0"

jobs:
  build:
    name: Build · Test · R8
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK: licencias y plataforma
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | sort | tail -n1 || true)"
          ANDROID_CLI="$(find "$SDK/cmdline-tools" -maxdepth 3 -name android -type f 2>/dev/null | sort | tail -n1 || true)"
          echo "SDK: $SDK"
          
          if [ -n "$ANDROID_CLI" ]; then
            "$ANDROID_CLI" --sdk="$SDK" sdk install "platforms/android-${ANDROID_API}" "build-tools/${ANDROID_BUILD_TOOLS}" "platform-tools" || true
            "$ANDROID_CLI" --sdk="$SDK" sdk install --licenses || true
          elif [ -n "$SDKMANAGER" ]; then
            "$SDKMANAGER" --version || true
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" --install "platforms;android-${ANDROID_API}" "build-tools;${ANDROID_BUILD_TOOLS}" "platform-tools" || true
          else
            echo "Sin cmdline-tools: usando SDK preinstalado."
          fi

      - name: Gradle y caché
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      - name: Verificar el wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Compilar debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Tests unitarios JVM
        run: ./gradlew testDebugUnitTest :domain:test :core:common:test --stacktrace

      - name: Release con R8
        run: ./gradlew :app:assembleRelease -PcomposeMetrics=true --stacktrace

      - name: Lint
        continue-on-error: true
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Publicar artefactos
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: divtrack-artifacts
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/reports/lint-results-*.html
            **/build/reports/tests/**
            **/build/compose-metrics/**
            core/database/schemas/**